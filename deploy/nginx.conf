# Include inside nginx's http {} context. Replace probe.example.com and certificate paths.
# If this nginx already has default servers on these ports, merge rejection rules into
# those servers rather than defining a second default_server.
limit_req_zone $binary_remote_addr zone=needle_rate:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=needle_conn:1m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name probe.example.com;
    return 308 https://probe.example.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name probe.example.com;
    ssl_certificate /etc/letsencrypt/live/probe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/probe.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    limit_req zone=needle_rate burst=20 nodelay;
    limit_req_status 429;
    limit_conn needle_conn 16;
    # Avoid storing request metadata / node identifiers in access logs.
    access_log off;
    location / {
        proxy_pass http://unix:/run/needle-panel/http.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering on;
    }
}
